security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/users$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/users$, methods: [GET], roles: ROLE_ADMIN }
        - { path: ^/api/users/\d+$, methods: [DELETE], roles: ROLE_ADMIN }
        - { path: ^/api/coaches, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/coaches, methods: [POST, PATCH, PUT, DELETE], roles: ROLE_ADMIN }
        - { path: ^/api/seances, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/seances, methods: [POST, PATCH, PUT, DELETE], roles: ROLE_ADMIN }
        - { path: ^/api/roles, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
